server {
    listen 80;
    listen [::]:80;
    server_name localhost kompetensi.rsudkilisuci.web.id _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Allow large ingest payload (up to 30MB)
    client_max_body_size 30M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml text/csv;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check endpoint
    location /health {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    # Static assets caching
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # Template download
    location /template/ {
        autoindex off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
