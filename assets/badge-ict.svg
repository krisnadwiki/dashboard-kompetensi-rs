<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 136" width="392" height="136" role="img" aria-label="ICT RSUD Kilisuci">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A60BD"/>
      <stop offset="1" stop-color="#3350A3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="190%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1B2A63" flood-opacity="0.35"/>
    </filter>
    <clipPath id="body">
      <rect x="10" y="8" width="372" height="104" rx="34"/>
    </clipPath>
  </defs>

  <!-- Badge body -->
  <rect x="10" y="8" width="372" height="104" rx="34" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Jejak sirkuit tipis (aksen IT) -->
  <g clip-path="url(#body)" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M382 26 H352 L343 35 H312"/>
    <path d="M382 40 H366"/>
    <path d="M382 98 H356 L348 106 H330"/>
    <circle cx="312" cy="35" r="2.6" fill="#FFFFFF" fill-opacity="0.22" stroke="none"/>
    <circle cx="366" cy="40" r="2.2" fill="#FFFFFF" fill-opacity="0.22" stroke="none"/>
    <circle cx="330" cy="106" r="2.6" fill="#FFFFFF" fill-opacity="0.22" stroke="none"/>
  </g>
  <rect x="11" y="9" width="370" height="102" rx="33" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Ikon: lingkaran + cincin node jaringan -->
  <circle cx="71" cy="60" r="42" fill="#FFFFFF" fill-opacity="0.12"/>
  <g>
    <circle cx="71" cy="60" r="47" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.2" stroke-dasharray="2 6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 71 60" to="360 71 60" dur="40s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.55">
    <circle cx="71" cy="13" r="2.4"/>
    <circle cx="111.7" cy="83.5" r="2.4"/>
    <circle cx="30.3" cy="83.5" r="2.4"/>
  </g>

  <!-- Huruf ict -->
  <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <line x1="47" y1="56" x2="47" y2="77"/>
    <path d="M79 61 A11.4 11.4 0 1 0 79 75"/>
    <path d="M93 36 V71 Q93 79 99 79"/>
    <line x1="87" y1="51" x2="101" y2="51" stroke-width="8"/>
  </g>
  <circle cx="47" cy="42" r="5.5" fill="#FFFFFF"/>

  <!-- Divider -->
  <line x1="130" y1="32" x2="130" y2="88" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Indikator online -->
  <circle cx="150" cy="40" r="3" fill="#4ADE80"/>
  <circle cx="150" cy="40" r="3" fill="none" stroke="#4ADE80" stroke-width="1.5">
    <animate attributeName="r" values="3;8" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.7;0" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Teks -->
  <g font-family="'Nunito','Segoe UI','Helvetica Neue',Arial,sans-serif" fill="#FFFFFF">
    <text x="162" y="44" font-size="12" font-weight="700" letter-spacing="3" fill="#C9D3FF" font-family="'JetBrains Mono','Consolas','Courier New',monospace">ICT</text>
    <text x="146" y="70" font-size="24" font-weight="800" textLength="196" lengthAdjust="spacingAndGlyphs">RSUD Kilisuci</text>
    <text x="146" y="90" font-size="9.5" font-weight="500" fill="#E3E8FF" textLength="216" lengthAdjust="spacingAndGlyphs">Information and Communication Technology</text>
  </g>
</svg>
