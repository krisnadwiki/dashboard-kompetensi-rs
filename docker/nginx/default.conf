server {
    listen 80;
    listen [::]:80;
    server_name localhost kompetensi.rsudkilisuci.web.id _;
    charset utf-8;
    root /var/www/html/public;
    index index.php index.html;

    # Allow large ingest payload (up to 30MB)
    client_max_body_size 30M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml text/csv;
    gzip_comp_level 5;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    # Static assets (PHP app) - cached with query param cache-busting (?v=...)
    location /assets/ {
        alias /var/www/html/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Static dashboard (original HTML app - served under /static-dashboard/)
    location /static-dashboard/ {
        alias /var/www/html/static-dashboard/;
        try_files $uri $uri/ /static-dashboard/index.html;
        add_header Cache-Control "no-store";
        location ~* \.(woff2?|png|ico|svg)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
        }
        # JS dan CSS tidak di-cache agar perubahan langsung efektif
        location ~* \.(js|css)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
            access_log off;
        }
    }

    # PHP routing - pass all to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
        fastcgi_read_timeout 120;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
